<!-- Confirm Dialog - Vintage Newspaper Design -->
<div class="confirm-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ data.title || 'Confirm Action' }}</h2>
  </div>

  <div class="dialog-content">
    <p class="dialog-message">{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    <button
      class="btn-cancel"
      (click)="onCancel()"
      type="button">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button
      class="btn-confirm"
      (click)="onConfirm()"
      type="button">
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
